name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimale Rechte. Einzelne Jobs erweitern sie nur, wenn nötig.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  qualitaet:
    name: Qualität (Format, Lint, Typen, Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Echte PostgreSQL-Datenbank für die Tests des CMS.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lena
          POSTGRES_PASSWORD: lena
          POSTGRES_DB: lena_cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lena:lena@localhost:5432/lena_cms_test
      # Nur für den Build des CMS in der CI. Echte Werte liegen ausschließlich bei den Hostern.
      DATABASE_URL: postgres://lena:lena@localhost:5432/lena_cms_test
      PAYLOAD_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CMS bauen
        run: pnpm --filter @lena/cms build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  e2e:
    name: Ende-zu-Ende und Barrierefreiheit (Playwright, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: qualitaet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (alle Kategorien 100)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: qualitaet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse, Median aus fünf Läufen
        env:
          LH_RUNS: '5'
          LH_MIN: '100'
        run: node scripts/lighthouse-check.mjs

  lieferkette:
    name: Lieferkette (Abhängigkeiten prüfen)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bekannte Schwachstellen in Produktionsabhängigkeiten
        run: pnpm audit --audit-level=moderate --prod
      - name: Signaturen der Pakete prüfen
        run: pnpm audit signatures
        continue-on-error: true

  abhaengigkeits-review:
    name: Abhängigkeiten im Pull Request prüfen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
