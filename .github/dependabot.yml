version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Neue Versionen erst nach einigen Tagen vorschlagen (Lieferketten-Schutz).
    cooldown:
      default-days: 3
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint-und-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'globals']
      tests:
        patterns: ['vitest', '@playwright/*', '@axe-core/*']
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
